name: Auditd Rule Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint audit rules
        run: bash ./scripts/lint-rules.sh audit.rules

  load-rules:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install audit tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y auditd

      - name: Validate rules on Ubuntu
        run: bash ./scripts/validate-rules-ci.sh audit.rules

  kylin-fixtures:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Check generator and preflight syntax
        run: |
          python3 -m py_compile scripts/prepare-kylin-rules.py
          sh -n scripts/preflight-rulesd.sh
          bash -n scripts/gen-privileged-rules.sh

      - name: Fixture tests for the Kylin generator
        run: python3 -m unittest discover -s tests -v
